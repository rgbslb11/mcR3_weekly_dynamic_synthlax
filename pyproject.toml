[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncaaf-synthetic-market-engine"
version = "0.1.0"
description = "Deterministic synthetic NCAAF binary market engine reference implementation"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "fastapi>=0.115,<1",
  "alembic>=1.14,<2",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
mc = ["pyarrow>=17,<22"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
